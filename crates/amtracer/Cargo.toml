[package]
name = "amtracer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
amtracer-abi = { path = "../amtracer-abi" }
anyhow = "1.0.105"
aya = "0.16.0"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
framehop = { version = "0.16.0", default-features = false, features = ["std"] }
libc = "0.2.191"
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "std", "compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaxpeax-arch = { version = "0.3.3", default-features = false, features = ["std"] }
yaxpeax-arm = { version = "0.5.0", default-features = false, features = ["std", "fmt"] }

[lints]
workspace = true
